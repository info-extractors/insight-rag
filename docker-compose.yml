services:
  api:
    build: .
    container_name: insightrag-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LLM_PROVIDER=mock
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  ui:
    build: .
    container_name: insightrag-ui
    command: streamlit run src/app/ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    restart: unless-stopped

